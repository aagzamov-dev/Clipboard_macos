name: Prepare release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: sudo xcode-select --switch /Applications/Xcode_27.0.app/Contents/Developer
      - run: Scripts/test.sh
      - run: Scripts/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Clipboard-release-candidate-unsigned
          path: .build/release/Clipboard.zip*
          if-no-files-found: error
